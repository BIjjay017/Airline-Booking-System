{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Manage Users</h2>

    {% if users %}
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>
                    <a href="{{ url_for('admin.delete_user', user_id=user[0]) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this user?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No users found.</p>
    {% endif %}

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
</div>
{% endblock %}
