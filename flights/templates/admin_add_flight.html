{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Add Flight</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Flight Number</label>
            <input type="text" name="flight_number" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Origin</label>
            <select name="origin_id" class="form-select" required>
                <option value="">Select Origin</option>
                {% for airport in airports %}
                <option value="{{ airport[0] }}">{{ airport[1] }} - {{ airport[2] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Destination</label>
            <select name="destination_id" class="form-select" required>
                <option value="">Select Destination</option>
                {% for airport in airports %}
                <option value="{{ airport[0] }}">{{ airport[1] }} - {{ airport[2] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="departure_time" class="form-label">Departure Time</label>
            <input type="datetime-local" class="form-control" id="departure_time" name="departure_time"
                   min="{{ today }}" required>
        </div>

        <div class="mb-3">
            <label for="duration_hours" class="form-label">Duration (Hours)</label>
            <input type="number" class="form-control" id="duration_hours" name="duration_hours" min="0" required>
        </div>

        <div class="mb-3">
            <label for="duration_minutes" class="form-label">Duration (Minutes)</label>
            <input type="number" class="form-control" id="duration_minutes" name="duration_minutes" min="0" max="59" value="0">
        </div>

        <div class="mb-3">
            <label class="form-label">Total Seats</label>
            <input type="number" name="total_seats" class="form-control" value="150" required>
        </div>


        <div class="mb-3">
            <label class="form-label">Aircraft Type</label>
             <select name="Aircraft Type" class="form-select" required>
                <option value="">Select Aircraft type</option>
                <option value="ATR72">ATR72</option>
                <option value="ATR">ATR</option>
                <option value="CRJ200">CRJ200</option>
                <option value="Q400">Q400</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Class</label>
            <select name="class" class="form-select" required>
                <option value="">Select Class</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="E1">E1</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="I">I</option>
                <option value="N">N</option>
                <option value="S">S</option>
                <option value="T">T</option>
                <option value="Y">Y</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Baggage Allowance (kg)</label>
            <input type="number" name="baggage_allowance" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Refund Type</label>
            <select name="refund_type" class="form-select" required>
                <option value="">Select Refund Policy</option>
                <option value="NonRefundable">Non-Refundable</option>
                <option value="Refundable">Full Refund</option>
            </select>
        </div>

        <!-- Remove manual price input, ML will set this -->
        {# <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div> #}

        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('admin.list_flights') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
